<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Wines by the Bottle — Creola</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            background-color: #1a2a3a;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: #f4d89f;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            text-transform: uppercase;
        }

        /* Page Header */
        .page-header {
            background-color: #1a2a3a;
            color: #ffffff;
            padding: 3rem 2rem;
            text-align: center;
        }

        .page-header h1 {
            font-family: Georgia, serif;
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            font-size: 0.95rem;
            color: #f4d89f;
            letter-spacing: 0.05em;
        }

        /* Main Content */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        /* Category Section */
        .category-section {
            margin-bottom: 4rem;
        }

        .category-title {
            font-family: Georgia, serif;
            font-size: 1.8rem;
            color: #1a2a3a;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .category-divider {
            width: 40px;
            height: 2px;
            background-color: #c9955f;
            margin-bottom: 2rem;
        }

        /* Wine Card */
        .wine-card {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 1.5rem;
        }

        .wine-card:hover {
            border-color: #c9955f;
            box-shadow: 0 2px 8px rgba(201, 149, 95, 0.15);
        }

        .wine-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .wine-info {
            flex: 1;
        }

        .wine-location-badge {
            background-color: #c9955f;
            color: #ffffff;
            padding: 0.4rem 0.8rem;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .wine-name {
            font-family: Georgia, serif;
            font-size: 1.2rem;
            color: #1a2a3a;
            font-weight: 400;
        }

        .wine-producer {
            font-size: 0.9rem;
            color: #555;
            margin-top: 0.25rem;
        }

        .wine-price {
            font-family: Georgia, serif;
            font-size: 1.1rem;
            color: #c9955f;
            text-align: right;
            white-space: nowrap;
            font-weight: 500;
        }

        .wine-vintage {
            font-size: 0.85rem;
            color: #777;
            margin-top: 0.25rem;
        }

        /* Toggle Indicator */
        .toggle-indicator {
            color: #c9955f;
            font-weight: 300;
            margin-top: 1rem;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        /* Expanded Content */
        .wine-details {
            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #ddd;
        }

        .wine-details.open {
            display: block;
        }

        .detail-row {
            margin-bottom: 1.5rem;
        }

        .detail-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1a2a3a;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .detail-content {
            font-size: 0.95rem;
            color: #333;
            line-height: 1.7;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.85rem;
            background-color: #f9f9f9;
            border-top: 1px solid #e0e0e0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
                flex-direction: column;
                gap: 0.5rem;
            }

            nav a:first-child {
                display: block;
                margin-bottom: 0.5rem;
            }

            .nav-links {
                gap: 0.75rem;
                flex-wrap: wrap;
            }

            .nav-links a {
                font-size: 0.65rem;
                padding: 0.5rem 0.75rem;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .page-header p {
                font-size: 0.85rem;
            }

            .wine-header {
                flex-direction: column;
            }

            .wine-price {
                text-align: left;
            }

            .container {
                padding: 1.5rem 1rem;
            }

            .wine-card {
                padding: 1.2rem;
            }

            .wine-name {
                font-size: 1.1rem;
            }

            .category-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Creola</a>
        <div class="nav-links">
            <a href="menu.html">Menu</a>
            <a href="by-glass.html">By the Glass</a>
            <a href="by-bottle.html">By the Bottle</a>
        </div>
    </nav>

    <div class="page-header">
        <h1>Wines by the Bottle</h1>
        <p>Full bottle selections</p>
    </div>

    <div class="container">
        <div id="wines-container">
            <div class="loading">Loading wines...</div>
        </div>
    </div>

    <footer>
        <p>Creola — Staff Educational Resource</p>
    </footer>

    <script>
        // Wines Google Sheet URL
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSz_CsAwRyuEkwZT1heANG0GzS2jjVlWAruquxxw_OnAQfBcsxYE4uhHpAf_rO4PU2nw4XPsZ3VM9jD/pub?gid=453357399&single=true&output=csv';

        async function loadWines() {
            try {
                const response = await fetch(SHEET_URL);
                const csv = await response.text();
                const wines = parseCSV(csv);
                
                // Filter for wines with priceBottle value AND NO priceGlass value (bottle-only wines)
                const byBottleWines = wines.filter(w => 
                    w.priceBottle && w.priceBottle.trim() !== '' && 
                    (!w.priceGlass || w.priceGlass.trim() === '')
                );
                
                renderWines(byBottleWines);
            } catch (error) {
                document.getElementById('wines-container').innerHTML = 
                    '<p style="text-align: center; color: #999;">Unable to load wines. Check that your Google Sheet URL is correct.</p>';
                console.error('Error loading wines:', error);
            }
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = parseCSVLine(lines[0]);
            const wines = [];

            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                const obj = {};

                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j]] = values[j] || '';
                }

                if (obj.id) wines.push(obj);
            }

            return wines;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let insideQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                const nextChar = line[i + 1];

                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        current += '"';
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }

            result.push(current.trim());
            return result;
        }

        function renderWines(wines) {
            const groupedWines = {};
            wines.forEach(wine => {
                if (!groupedWines[wine.category]) {
                    groupedWines[wine.category] = [];
                }
                groupedWines[wine.category].push(wine);
            });

            const container = document.getElementById('wines-container');
            container.innerHTML = '';

            const categoryOrder = ['Sparkling', 'White', 'Red'];

            categoryOrder.forEach(category => {
                if (groupedWines[category]) {
                    const section = document.createElement('div');
                    section.className = 'category-section';

                    const title = document.createElement('div');
                    title.className = 'category-title';
                    title.textContent = category;

                    const divider = document.createElement('div');
                    divider.className = 'category-divider';

                    section.appendChild(title);
                    section.appendChild(divider);

                    groupedWines[category].forEach(wine => {
                        const card = document.createElement('div');
                        card.className = 'wine-card';

                        card.innerHTML = `
                            <div class="wine-header">
                                <div class="wine-info">
                                    <div class="wine-name">${wine.name}</div>
                                    <div class="wine-producer">${wine.producer}</div>
                                    <div class="wine-vintage">${wine.vintage} • ${wine.region}</div>
                                </div>
                                <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end;">
                                    <div>
                                        <div class="wine-price">$${wine.priceBottle}</div>
                                        <div class="wine-vintage">per bottle</div>
                                    </div>
                                    ${wine.location ? `<div class="wine-location-badge">${wine.location}</div>` : ''}
                                </div>
                            </div>
                            <div class="wine-details">
                                <div class="detail-row">
                                    <div class="detail-label">Tasting Notes</div>
                                    <div class="detail-content">${wine.tastingNotes}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Grape</div>
                                    <div class="detail-content">${wine.grape}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">About this Cuvée</div>
                                    <div class="detail-content">${wine.aboutCuvee}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Winery</div>
                                    <div class="detail-content">${wine.wineryProfile}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Farming & Winemaking</div>
                                    <div class="detail-content">${wine.farmingWinemaking}</div>
                                </div>
                            </div>
                            <div class="toggle-indicator">Click to expand</div>
                        `;

                        card.addEventListener('click', function() {
                            this.querySelector('.wine-details').classList.toggle('open');
                            const indicator = this.querySelector('.toggle-indicator');
                            indicator.textContent = this.querySelector('.wine-details').classList.contains('open') ? 'Click to collapse' : 'Click to expand';
                        });

                        section.appendChild(card);
                    });

                    container.appendChild(section);
                }
            });
        }

        // Load wines on page load
        loadWines();
    </script>
</body>
</html>
