<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wines by the Bottle — Creola</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f3f0;
            color: #2c2c2c;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            background-color: #1a2a3a;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: #d4a574;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            text-transform: uppercase;
        }

        /* Page Header */
        .page-header {
            background-color: #1a2a3a;
            color: #f5f3f0;
            padding: 3rem 2rem;
            text-align: center;
        }

        .page-header h1 {
            font-family: Georgia, serif;
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            font-size: 0.95rem;
            color: #d4a574;
            letter-spacing: 0.05em;
        }

        /* Main Content */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 2rem;
            color: #999;
        }

        /* Category Section */
        .category-section {
            margin-bottom: 4rem;
        }

        .category-title {
            font-family: Georgia, serif;
            font-size: 1.8rem;
            color: #1a2a3a;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .category-divider {
            width: 40px;
            height: 2px;
            background-color: #d4a574;
            margin-bottom: 2rem;
        }

        /* Wine Card */
        .wine-card {
            background-color: #fafaf8;
            border: 1px solid #e8e5e0;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 1.5rem;
        }

        .wine-card:hover {
            border-color: #d4a574;
            box-shadow: 0 2px 8px rgba(212, 165, 116, 0.1);
        }

        .wine-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .wine-name {
            font-family: Georgia, serif;
            font-size: 1.2rem;
            color: #1a2a3a;
            font-weight: 400;
        }

        .wine-producer {
            font-size: 0.9rem;
            color: #999;
            margin-top: 0.25rem;
        }

        .wine-price {
            font-family: Georgia, serif;
            font-size: 1.1rem;
            color: #d4a574;
            text-align: right;
            white-space: nowrap;
        }

        .wine-vintage {
            font-size: 0.85rem;
            color: #999;
            margin-top: 0.25rem;
        }

        /* Toggle Indicator */
        .toggle-indicator {
            color: #d4a574;
            font-weight: 300;
            margin-top: 1rem;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        /* Expanded Content */
        .wine-details {
            display: none;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e8e5e0;
        }

        .wine-details.open {
            display: block;
        }

        .detail-row {
            margin-bottom: 1.5rem;
        }

        .detail-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1a2a3a;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .detail-content {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.7;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: #999;
            font-size: 0.85rem;
            background-color: #fafaf8;
            border-top: 1px solid #e8e5e0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 1.8rem;
            }

            .wine-header {
                flex-direction: column;
            }

            .wine-price {
                text-align: left;
            }

            .container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Creola</a>
        <div class="nav-links">
            <a href="by-glass.html">By the Glass</a>
            <a href="by-bottle.html">By the Bottle</a>
        </div>
    </nav>

    <div class="page-header">
        <h1>Wines by the Bottle</h1>
        <p>Full bottle selections</p>
    </div>

    <div class="container">
        <div id="wines-container">
            <div class="loading">Loading wines...</div>
        </div>
    </div>

    <footer>
        <p>Creola — Staff Educational Resource</p>
    </footer>

    <script>
        // ⚠️ REPLACE THIS WITH YOUR PUBLISHED GOOGLE SHEET URL
        // Instructions: 
        // 1. Create a Google Sheet with wine data
        // 2. Click File → Publish to the web
        // 3. Select CSV format
        // 4. Copy the URL and paste it here:
        
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSz_CsAwRyuEkwZT1heANG0GzS2jjVlWAruquxxw_OnAQfBcsxYE4uhHpAf_rO4PU2nw4XPsZ3VM9jD/pub?gid=453357399&single=true&output=csv';

        async function loadWines() {
            try {
                const response = await fetch(SHEET_URL);
                const csv = await response.text();
                const wines = parseCSV(csv);
                
                // Filter for wines with priceBottle value
                const byBottleWines = wines.filter(w => w.priceBottle && w.priceBottle.trim() !== '');
                
                renderWines(byBottleWines);
            } catch (error) {
                document.getElementById('wines-container').innerHTML = 
                    '<p style="text-align: center; color: #999;">Unable to load wines. Check that your Google Sheet URL is correct.</p>';
                console.error('Error loading wines:', error);
            }
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = parseCSVLine(lines[0]);
            const wines = [];

            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                const obj = {};

                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j]] = values[j] || '';
                }

                if (obj.id) wines.push(obj);
            }

            return wines;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let insideQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                const nextChar = line[i + 1];

                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        current += '"';
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }

            result.push(current.trim());
            return result;
        }

        function renderWines(wines) {
            const groupedWines = {};
            wines.forEach(wine => {
                if (!groupedWines[wine.category]) {
                    groupedWines[wine.category] = [];
                }
                groupedWines[wine.category].push(wine);
            });

            const container = document.getElementById('wines-container');
            container.innerHTML = '';

            const categoryOrder = ['Sparkling', 'White', 'Red'];

            categoryOrder.forEach(category => {
                if (groupedWines[category]) {
                    const section = document.createElement('div');
                    section.className = 'category-section';

                    const title = document.createElement('div');
                    title.className = 'category-title';
                    title.textContent = category;

                    const divider = document.createElement('div');
                    divider.className = 'category-divider';

                    section.appendChild(title);
                    section.appendChild(divider);

                    groupedWines[category].forEach(wine => {
                        const card = document.createElement('div');
                        card.className = 'wine-card';

                        card.innerHTML = `
                            <div class="wine-header">
                                <div>
                                    <div class="wine-name">${wine.name}</div>
                                    <div class="wine-producer">${wine.producer}</div>
                                    <div class="wine-vintage">${wine.vintage} • ${wine.region}</div>
                                </div>
                                <div>
                                    <div class="wine-price">$${wine.priceBottle}</div>
                                    <div class="wine-vintage">per bottle</div>
                                </div>
                            </div>
                            <div class="wine-details">
                                <div class="detail-row">
                                    <div class="detail-label">Tasting Notes</div>
                                    <div class="detail-content">${wine.tastingNotes}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Grape</div>
                                    <div class="detail-content">${wine.grape}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">About this Cuvée</div>
                                    <div class="detail-content">${wine.aboutCuvee}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Winery</div>
                                    <div class="detail-content">${wine.wineryProfile}</div>
                                </div>
                                <div class="detail-row">
                                    <div class="detail-label">Farming & Winemaking</div>
                                    <div class="detail-content">${wine.farmingWinemaking}</div>
                                </div>
                            </div>
                            <div class="toggle-indicator">Click to expand</div>
                        `;

                        card.addEventListener('click', function() {
                            this.querySelector('.wine-details').classList.toggle('open');
                            const indicator = this.querySelector('.toggle-indicator');
                            indicator.textContent = this.querySelector('.wine-details').classList.contains('open') ? 'Click to collapse' : 'Click to expand';
                        });

                        section.appendChild(card);
                    });

                    container.appendChild(section);
                }
            });
        }

        // Load wines on page load
        loadWines();
    </script>
</body>
</html>
