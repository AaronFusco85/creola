<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Menu — Creola</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            background-color: #1a2a3a;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: #f4d89f;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            text-transform: uppercase;
        }

        /* Page Header */
        .page-header {
            background-color: #1a2a3a;
            color: #ffffff;
            padding: 3rem 2rem;
            text-align: center;
        }

        .page-header h1 {
            font-family: Georgia, serif;
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            font-size: 0.95rem;
            color: #f4d89f;
            letter-spacing: 0.05em;
        }

        /* Main Content */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* Menu Section */
        .menu-section {
            margin-bottom: 4rem;
        }

        .section-title {
            font-family: Georgia, serif;
            font-size: 1.8rem;
            color: #1a2a3a;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .section-divider {
            width: 40px;
            height: 2px;
            background-color: #c9955f;
            margin-bottom: 2rem;
        }

        /* Dish Card */
        .dish-card {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            margin-bottom: 2rem;
            padding: 2rem;
            display: grid;
            gap: 1.5rem;
        }

        .dish-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .dish-name {
            font-family: Georgia, serif;
            font-size: 1.3rem;
            color: #1a2a3a;
            font-weight: 400;
        }

        .dish-description {
            font-size: 0.95rem;
            color: #333;
            line-height: 1.7;
            font-style: italic;
        }

        /* Wine Pairing Box */
        .wine-pairing {
            border-top: 1px solid #ddd;
            padding-top: 1.5rem;
        }

        .pairing-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #1a2a3a;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .wine-pairing-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 2rem;
        }

        .pairing-wine-info {
            flex: 1;
        }

        .pairing-wine-name {
            font-family: Georgia, serif;
            font-size: 1.1rem;
            color: #1a2a3a;
            font-weight: 400;
        }

        .pairing-producer {
            font-size: 0.9rem;
            color: #555;
            margin-top: 0.25rem;
        }

        .pairing-details {
            font-size: 0.85rem;
            color: #333;
            margin-top: 0.5rem;
            line-height: 1.6;
        }

        .pairing-price {
            font-family: Georgia, serif;
            font-size: 1rem;
            color: #c9955f;
            text-align: right;
            white-space: nowrap;
            font-weight: 500;
        }

        .price-label {
            font-size: 0.75rem;
            color: #777;
            margin-top: 0.25rem;
        }

        /* No Pairing */
        .no-pairing {
            color: #999;
            font-style: italic;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.85rem;
            background-color: #f9f9f9;
            border-top: 1px solid #e0e0e0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
                flex-direction: column;
                gap: 0.5rem;
            }

            nav a:first-child {
                display: block;
                margin-bottom: 0.5rem;
            }

            .nav-links {
                gap: 0.75rem;
                flex-wrap: wrap;
            }

            .nav-links a {
                font-size: 0.65rem;
                padding: 0.5rem 0.75rem;
            }

            .page-header h1 {
                font-size: 1.5rem;
                margin-bottom: 0.25rem;
            }

            .page-header p {
                font-size: 0.85rem;
            }

            .dish-header {
                flex-direction: column;
            }

            .wine-pairing-content {
                flex-direction: column;
            }

            .pairing-price {
                text-align: left;
            }

            .container {
                padding: 1.5rem 1rem;
            }

            .dish-card {
                padding: 1.5rem;
            }

            .dish-name {
                font-size: 1.1rem;
            }

            .dish-description {
                font-size: 0.9rem;
            }

            .pairing-wine-name {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Creola</a>
        <div class="nav-links">
            <a href="menu.html">Menu</a>
            <a href="by-glass.html">By the Glass</a>
            <a href="by-bottle.html">By the Bottle</a>
        </div>
    </nav>

    <div class="page-header">
        <h1>Menu</h1>
        <p>Dishes with suggested wine pairings</p>
    </div>

    <div class="container">
        <div id="menu-container">
            <div style="text-align: center; padding: 2rem; color: #999;">Loading menu...</div>
        </div>
    </div>

    <footer>
        <p>Creola — Staff Educational Resource</p>
    </footer>

    <script>
        // Menu Google Sheet URL
        const MENU_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSz_CsAwRyuEkwZT1heANG0GzS2jjVlWAruquxxw_OnAQfBcsxYE4uhHpAf_rO4PU2nw4XPsZ3VM9jD/pub?gid=424179519&single=true&output=csv';

        async function loadMenu() {
            try {
                const response = await fetch(MENU_SHEET_URL);
                const csv = await response.text();
                const dishes = parseCSV(csv);
                
                if (dishes.length === 0) {
                    document.getElementById('menu-container').innerHTML = 
                        '<p style="text-align: center; color: #999;">No dishes found. Check the sheet has data.</p>';
                    return;
                }
                
                renderMenu(dishes);
            } catch (error) {
                document.getElementById('menu-container').innerHTML = 
                    '<p style="text-align: center; color: #999;">Unable to load menu. Please try again.</p>';
                console.error('Error loading menu:', error);
            }
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = parseCSVLine(lines[0]);
            const dishes = [];

            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                const obj = {};

                for (let j = 0; j < headers.length; j++) {
                    obj[headers[j]] = values[j] || '';
                }

                if (obj.id) dishes.push(obj);
            }

            return dishes;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let insideQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                const nextChar = line[i + 1];

                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        current += '"';
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }

            result.push(current.trim());
            return result;
        }

        function renderMenu(dishes) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            const section = document.createElement('div');
            section.className = 'menu-section';

            const title = document.createElement('div');
            title.className = 'section-title';
            title.textContent = 'Snacks';

            const divider = document.createElement('div');
            divider.className = 'section-divider';

            section.appendChild(title);
            section.appendChild(divider);

            dishes.forEach(dish => {
                const card = document.createElement('div');
                card.className = 'dish-card';

                let pairingHTML = '';
                if (dish.pairingWine && dish.pairingWine.trim()) {
                    pairingHTML = `
                        <div class="wine-pairing">
                            <div class="pairing-label">Suggested Pairing</div>
                            <div class="wine-pairing-content">
                                <div class="pairing-wine-info">
                                    <div class="pairing-wine-name">${dish.pairingWine}</div>
                                    <div class="pairing-details">${dish.pairingDescription || 'Pairing notes coming soon.'}</div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    pairingHTML = `
                        <div class="wine-pairing">
                            <div class="pairing-label">Suggested Pairing</div>
                            <div class="wine-pairing-content">
                                <div class="pairing-wine-info">
                                    <div class="no-pairing">No wine pairing suggested</div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="dish-header">
                        <div>
                            <div class="dish-name">${dish.foodName}</div>
                            <div class="dish-description">${dish.foodDescription}</div>
                        </div>
                    </div>
                    ${pairingHTML}
                `;

                section.appendChild(card);
            });

            container.appendChild(section);
        }

        // Load menu on page load
        loadMenu();
    </script>
</body>
</html>
